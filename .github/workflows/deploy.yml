
name: Deploy Django Application

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: digital-banking-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy Django Application on EC2
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /home/ubuntu/digital-banking-api

          echo "Pulling latest code..."
          git pull --ff-only origin main

          echo "Building and starting containers..."
          sudo -n docker compose up -d --build

          echo "Running database migrations..."
          sudo -n docker compose exec -T web python manage.py migrate --noinput

          echo "Checking containers..."
          sudo -n docker compose ps

          echo "Deployment completed successfully!"
