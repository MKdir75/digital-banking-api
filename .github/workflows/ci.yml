
name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: banking_test
          POSTGRES_USER: banking_user
          POSTGRES_PASSWORD: banking_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U banking_user -d banking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-development-secret
      DEBUG: "True"
      ALLOWED_HOSTS: 127.0.0.1,localhost

      DB_NAME: banking_test
      DB_USER: banking_user
      DB_PASSWORD: banking_password
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django system check
        run: |
          python manage.py check

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          pytest -v
